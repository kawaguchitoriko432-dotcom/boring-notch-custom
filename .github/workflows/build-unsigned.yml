# Необязательно: сборка без Xcode на вашем Mac. Запуск: вкладка Actions -> Run workflow.
# Результат: артефакт boringNotch-unsigned.zip (подпись ad-hoc, для личного использования).
name: Build (unsigned)
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          xcodebuild -project boringNotch.xcodeproj -scheme boringNotch -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" build
      - name: Zip
        run: ditto -c -k --keepParent build/Build/Products/Release/boringNotch.app boringNotch-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: boringNotch-unsigned
          path: boringNotch-unsigned.zip
