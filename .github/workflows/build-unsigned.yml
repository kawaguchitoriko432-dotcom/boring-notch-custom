# Необязательно: сборка без Xcode на вашем Mac. Запуск: вкладка Actions -> Run workflow.
# Результат: артефакт boringNotch-unsigned.zip (подпись ad-hoc, для личного использования).
name: Build (unsigned)
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          xcodebuild -project boringNotch.xcodeproj -scheme boringNotch -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Zip
        run: |
          codesign --force --deep --sign - "build/Build/Products/Release/Boring Notch.app"
          ditto "build/Build/Products/Release/Boring Notch.app" boringNotch.app
          ditto -c -k --keepParent boringNotch.app boringNotch-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: boringNotch-unsigned
          path: boringNotch-unsigned.zip
